<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HACCP Software Demo Access</title>

    <meta name="description" content="Access the HACCP Software demo environment for food safety management, CCP monitoring and compliance system.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://your-domain.com/demo-gateway">

    <!-- Open Graph -->
    <meta property="og:title" content="HACCP Software Demo Access">
    <meta property="og:description" content="Enter the HACCP software demo environment for food safety compliance and CCP monitoring system preview.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/images/haccpilot.jpg">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="HACCP Software Demo Access">
    <meta name="twitter:description" content="Access the HACCP software demo environment and explore the system.">
    <meta name="twitter:image" content="/images/haccpilot.jpg">


    <style>
        :root {
            --accent-primary: #1062b9;
            --accent-primary-dark: #1058a4;
            --text-color: #273a55;
            --text-light-grey: #6b7280;
            --bg-white: #ffffff;
            --bg-light-blue: #eef6ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-light-blue);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: var(--bg-white);
            position: relative;
            overflow: hidden;
            cursor: default;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            background-image: url(./background_building.jpg);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.1;
            transform: scale(1.05);
            pointer-events: none;
        }

        .box-dialog{
            padding: 40px 30px;
            max-width: 420px;
            width: 90%;
            background: #f7f6f2;
            z-index: 1;
            border: 2px solid #868686;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        p {
            font-size: 14px;
            color: var(--text-light-grey);
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: var(--accent-primary);
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            transition: background 0.2s ease;
        }

        .btn:hover {
            background: var(--accent-primary-dark);
        }
    </style>
</head>
<body>

<div class="box-dialog">
    <h1>HACCP Software is under development</h1>

    <p>
        You are invited to explore the demo version.
    </p>

    <a href="/demo" class="btn">Go to Demo</a>
</div>

</body>
</html>
